# violet-classic: the first a notebook app look (no title bar or ribbon keys): the GUI's three-pane chrome, drawn with our own art.
# White page; light grey side panes with a darker purple rail down the notebook pane; flat section tabs with
# rounded tops and the section's colour under the label; page rows with a purple selection bar.
# Copy this folder to ~/.config/meridian/skins/violet-classic and run `skin-use violet-classic`.
# The newer purple title bar and ribbon version is ../violet. Keys: docs/skins.md, "Widgets".
name = violet-classic
base = light
fg = #1a1a1a
bg = #ffffff

# Section strip colours: a tab's strip is its ansi1..ansi6 colour (by position) mixed halfway to white,
# which gives a notebook app's pastel section colours (red, green, amber, blue, purple, teal).
ansi1 = #eb2d35
ansi2 = #6f932f
ansi3 = #e58f00
ansi4 = #1551c9
ansi5 = #693dbd
ansi6 = #23755d

accent = #80397b

# ---- the editor page (cell grid roles)
page.bg = #ffffff
page.inset = 1 0
page.fg = #1a1a1a
gutter.fg = #a6a6a6
gutter.current.fg = #80397b
cursorline.bg = #f7f1f6
select.bg = #e3cfe1
select.fg = #1a1a1a
find.bg = #ffe08a
find.fg = #1a1a1a
link.fg = #0563c1
tilde = #e2e2e2

# ---- cell chrome (the terminal build and MERIDIAN_CELL_CHROME=1): the same palette as the widgets
tab.bg = #f3f3f3
tab.fg = #444444
tab.dim.bg = #f3f3f3
tab.active.bg = #ffffff
tab.active.fg = #80397b
bar.bg = #f3f3f3
side.bg = #f3f3f3
side.fg = #333333
side.head.fg = #80397b
side.active.bg = #ffffff
side.active.fg = #80397b
side.dim.bg = #e6e6e6
status.bg = #f3f3f3
status.fg = #444444
list.select.bg = #e3cfe1
list.on.bg = #80397b

# ---- widgets
ui.sectiontab.height = 32
ui.sectiontab.padding = 14
ui.listrow.height = 28
ui.title.height = 44
ui.statusbar.height = 22
ui.gap = 6
ui.scrollbar.width = 10
ui.splitter.width = 3
ui.icon.size = 16

ui.window.normal.bg = #ffffff

ui.notebooks.normal.bg = image(notebooks.png, slice 0 1 0 4)
ui.pages.normal.bg = #f3f3f3
ui.sections.normal.bg = image(sections.png, slice 0 0 1 0)

ui.sectiontab.normal.bg = image(tab.png, slice 9 6 2 4)
ui.sectiontab.normal.fg = #444444
ui.sectiontab.normal.size = 10
ui.sectiontab.hover.bg = image(tab-hover.png, slice 9 6 2 4)
ui.sectiontab.hover.fg = #1a1a1a
ui.sectiontab.active.bg = image(tab-active.png, slice 6 6 2 4)
ui.sectiontab.active.fg = #80397b

ui.listrow.normal.fg = #333333
ui.listrow.normal.size = 10
ui.listrow.hover.bg = image(row-hover.png, slice 0 0 0 4)
ui.listrow.hover.fg = #1a1a1a
ui.listrow.selected.bg = image(row-selected.png, slice 0 0 0 4)
ui.listrow.selected.fg = #80397b
ui.listrow.pressed.bg = image(row-hover.png, slice 0 0 0 4)

ui.title.normal.bg = #ffffff
ui.title.normal.fg = #1a1a1a
ui.title.normal.font = ui
ui.title.normal.size = 18

ui.status.normal.bg = image(status.png, slice 1 0 0 0)
ui.status.normal.fg = #444444
ui.status.normal.size = 9

ui.button.normal.bg = #00000000
ui.button.normal.fg = #80397b
ui.button.hover.bg = #e1e1e1
ui.button.pressed.bg = #d0d0d0

ui.splitter.normal.bg = #e1e1e1
ui.splitter.hover.bg = #c9a6c6
ui.splitter.pressed.bg = #80397b

ui.scrollthumb.normal.bg = image(thumb.png, slice 5 3 5 3)
ui.scrollthumb.hover.bg = image(thumb-hover.png, slice 5 3 5 3)
ui.scrollthumb.pressed.bg = image(thumb-hover.png, slice 5 3 5 3)

ui.icon.notebook = image(icons/notebook.png)
ui.icon.section = image(icons/section.png)
ui.icon.page = image(icons/page.png)
ui.icon.add = image(icons/add.png)
ui.icon.chevron-left = image(icons/chevron-left.png)
ui.icon.chevron-right = image(icons/chevron-right.png)
ui.icon.dirty = image(icons/dirty.png)
