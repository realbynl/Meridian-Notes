# A textured skin: a stone sidebar, a framed page and a gem ornament. All pictures are generated by make-art.py.
# Copy this folder to ~/.config/meridian/skins/stone and run `skin-use stone`.
name = stone
accent = #6fb3a0

# Tiled stone behind the sidebar.
side.bg = image(stone.png, tile)

# The page sits in a carved frame: 8 px corners stay sharp, the dark middle stretches.
page.bg = image(frame.png, slice 8 8 8 8)
# Keep text one cell inside the frame.
page.inset = 1 1

# A gem in the top right corner, over the text; clicks pass through it.
orn.1 = image(gem.png) anchor top-right offset -6 6 layer above

# The active tab and sidebar row get plain colours that suit the stone.
tab.active.bg = #2c3a37
tab.active.fg = #d8efe8
side.active.bg = #3b4b47
