# violet: the GUI's chrome in the look of a notebook app, drawn with our own art.
# Purple title bar and ribbon tab row with the quick-access buttons; light grey ribbon with coloured command icons;
# white notebook pane fading to grey with bold notebook cards; the pale purple page list beside it; section tabs filled
# with their colours over a pastel band; white page.
# Colours and sizes were sampled from a notebook app window (logical px). Every picture and icon is original art made
# by ../make-violet.py (arithmetic shapes; nothing copied from any product).
# Copy this folder (without make-violet.py, which lives beside it) to ~/.config/meridian/skins/violet
# and run `skin-use violet`. Keys: docs/skins.md, "Widgets".
name = violet
base = light
fg = #1a1a1a
bg = #ffffff

# Section and notebook colours: a section tab's strip and a notebook's cover is its ansi1..ansi6 colour (by position)
# mixed halfway to white, which gives a notebook app's pastels: #f39b9b red, #9dce78 green, #f1b87f orange, #8ab6e2 blue,
# #d6a6d3 purple, #87c9d9 teal. They keep their terminal meaning (red, green, yellow, blue, magenta, cyan).
ansi1 = #e73737
ansi2 = #3b9d00
ansi3 = #e37100
ansi4 = #156dc5
ansi5 = #ad4da7
ansi6 = #0f93b3

accent = #80397b

# Notebook tint: with this set, every colour near this purple (title bar, ribbon, hovers, page list, pictures) moves to
# the open notebook's colour. Pick one with the `notebook-colour` command; without a pick, one of ansi1..ansi6.
ui.notebook.tint = #80397b

# ---- the editor page (cell grid roles)
page.bg = #ffffff
page.inset = 1 0
page.fg = #1a1a1a
gutter.fg = #a6a6a6
gutter.current.fg = #80397b
cursorline.bg = #f7f1f6
select.bg = #e3cfe1
select.fg = #1a1a1a
find.bg = #ffe08a
find.fg = #1a1a1a
link.fg = #0563c1
tilde = #e2e2e2

# ---- cell chrome (the terminal build and MERIDIAN_CELL_CHROME=1): the same palette as the widgets
tab.bg = #f3f3f3
tab.fg = #444444
tab.dim.bg = #f3f3f3
tab.active.bg = #ffffff
tab.active.fg = #80397b
bar.bg = #f3f3f3
side.bg = #f3f3f3
side.fg = #333333
side.head.fg = #80397b
side.active.bg = #ffffff
side.active.fg = #80397b
side.dim.bg = #e6e6e6
status.bg = #f3f3f3
status.fg = #444444
list.select.bg = #e3cfe1
list.on.bg = #80397b

# ---- sizes (logical px)
ui.titlebar.enabled = 1
ui.titlebar.height = 32
ui.ribbontab.height = 32
ui.ribbon.height = 93
ui.ribbonbutton.large = 44
ui.ribbonbutton.small = 22
ui.menuitem.height = 24
ui.sectiontab.height = 32
ui.sectiontab.padding = 14
ui.search.width = 190
ui.notebooks.width = 192
ui.notebooks.header = 38
ui.notebookrow.height = 40
ui.pages.width = 112
ui.listrow.height = 24
ui.doctab.height = 26
ui.title.height = 56
ui.statusbar.height = 22
ui.gap = 5
ui.scrollbar.width = 10
ui.splitter.width = 2
ui.icon.size = 16
# The page list sits between the notebooks and the page; section tabs are filled with their section colour.
ui.pages.left = 1
ui.sectiontab.fill = 1

# ---- widgets
ui.window.normal.bg = #ffffff

# Title bar: the accent with white text; quick-access and window buttons lighten under the pointer.
ui.titlebar.normal.bg = #80397b
ui.titlebar.normal.fg = #ffffff
ui.titlebar.normal.size = 9.5
ui.qabutton.normal.fg = #ffffff
ui.qabutton.hover.bg = #995494
ui.qabutton.pressed.bg = #6a2f66
ui.qabutton.disabled.fg = #b78ab3
ui.winbutton.normal.fg = #ffffff
ui.winbutton.hover.bg = #995494
ui.winbutton.pressed.bg = #6a2f66
ui.closebutton.normal.fg = #ffffff
ui.closebutton.hover.bg = #e81123
ui.closebutton.hover.fg = #ffffff
ui.closebutton.pressed.bg = #f1707a
ui.closebutton.pressed.fg = #ffffff

# Ribbon: the tab row continues the purple title bar with white tab names; the open page's tab is the body's light
# grey with purple text, so it runs into the body. File is the bar's purple too and darkens under the pointer and while
# its menu is open.
ui.ribbonbar.normal.bg = #80397b
ui.ribbonbody.normal.bg = #f1f1f1
ui.ribbonbody.normal.fg = #262626
ui.ribbontab.normal.fg = #ffffff
ui.ribbontab.normal.size = 9.5
ui.ribbontab.hover.bg = #995494
ui.ribbontab.hover.fg = #ffffff
ui.ribbontab.pressed.bg = #6a2f66
ui.ribbontab.active.bg = #f1f1f1
ui.ribbontab.active.fg = #80397b
ui.ribbonfile.normal.bg = #80397b
ui.ribbonfile.normal.fg = #ffffff
ui.ribbonfile.hover.bg = #6a2f66
ui.ribbonfile.pressed.bg = #5c2858
ui.ribbonfile.active.bg = #5c2858
ui.ribbongroup.normal.fg = #595959
ui.ribbongroup.normal.border = #dbdbdb
ui.ribbongroup.normal.size = 8.5
ui.ribbonbutton.normal.fg = #262626
ui.ribbonbutton.normal.size = 9
ui.ribbonbutton.hover.bg = #dcdcdc
ui.ribbonbutton.pressed.bg = #c8c8c8
ui.ribbonbutton.active.bg = #d2d2d2
ui.ribbonbutton.selected.bg = #d2d2d2
ui.ribbonbutton.disabled.fg = #a6a6a6

# Menus and tooltips: white with a grey frame.
ui.menu.normal.bg = #ffffff
ui.menu.normal.border = #c6c6c6
ui.menuitem.normal.fg = #262626
ui.menuitem.normal.size = 9.5
ui.menuitem.hover.bg = #e1e1e1
ui.menuitem.selected.bg = #e1e1e1
ui.menuitem.active.bg = #e1e1e1
ui.menuitem.disabled.fg = #a6a6a6
ui.tooltip.normal.bg = #ffffff
ui.tooltip.normal.fg = #444444
ui.tooltip.normal.border = #bcbcbc
ui.tooltip.normal.size = 9

# Notebook pane: white fading to light grey, a light "Notebooks" header, bold cards.
ui.notebooks.normal.bg = linear(180deg, #ffffff 0%, #f0f0f0 100%)
ui.notebookrow.normal.fg = #262626
ui.notebookrow.normal.font = ui-bold
ui.notebookrow.normal.size = 11
ui.notebookrow.hover.bg = #ececec
ui.notebookrow.selected.bg = #e1e1e1
ui.notebookrow.active.bg = #e1e1e1

# Page list (left of the page): pale purple; the open page is a white framed row.
ui.pages.normal.bg = #f4e8f3
ui.sections.normal.bg = image(sections.png, slice 0 0 4 0)

# Section tabs: with ui.sectiontab.fill the pictures are only shapes (drawn in each section's colour): inactive tabs
# sit lower and stop above the band, the active tab is taller and runs into it.
ui.sectiontab.normal.bg = image(tab.png, slice 13 6 4 4)
ui.sectiontab.normal.fg = #262626
ui.sectiontab.normal.size = 9.5
ui.sectiontab.hover.bg = image(tab-active.png, slice 8 6 2 4)
ui.sectiontab.hover.fg = #1a1a1a
ui.sectiontab.active.bg = image(tab-active.png, slice 8 6 2 4)
ui.sectiontab.active.fg = #1a1a1a

ui.listrow.normal.fg = #333333
ui.listrow.normal.size = 9.5
ui.listrow.hover.bg = image(row-hover.png)
ui.listrow.hover.fg = #1a1a1a
ui.listrow.selected.bg = image(row-selected.png, slice 1 1 1 1)
ui.listrow.selected.fg = #1a1a1a
ui.listrow.pressed.bg = image(row-hover.png)
ui.listrow.disabled.fg = #444444

ui.title.normal.bg = #ffffff
ui.title.normal.fg = #1a1a1a
ui.title.normal.font = ui
ui.title.normal.size = 18

ui.status.normal.bg = image(status.png, slice 1 0 0 0)
ui.status.normal.fg = #595959
ui.status.normal.size = 9

# Buttons: the Add Page bar on top of the page list (pastel) and the section strip's arrows and "+".
ui.button.normal.bg = image(button.png, slice 5 4 1 4)
ui.button.normal.fg = #3d1a3a
ui.button.normal.size = 10
ui.button.hover.bg = image(button-hover.png, slice 5 4 1 4)
ui.button.pressed.bg = image(button-pressed.png, slice 5 4 1 4)

ui.searchbox.normal.bg = #ffffff
ui.searchbox.normal.fg = #444444
ui.searchbox.normal.border = #b4b4b4
ui.searchbox.normal.size = 9
ui.searchbox.hover.border = #8a8a8a
ui.searchbox.active.border = #80397b
ui.searchbox.disabled.fg = #8a8a8a

# Open-document tabs (when more than one document is open).
ui.doctab.normal.bg = #f1f1f1
ui.doctab.normal.fg = #444444
ui.doctab.normal.size = 9.5
ui.doctab.hover.bg = #e1e1e1
ui.doctab.pressed.bg = #d2d2d2
ui.doctab.active.bg = #ffffff
ui.doctab.active.fg = #80397b

ui.splitter.normal.bg = #e1e1e1
ui.splitter.hover.bg = #c9a6c6
ui.splitter.pressed.bg = #80397b

ui.scrollthumb.normal.bg = image(thumb.png, slice 5 3 5 3)
ui.scrollthumb.hover.bg = image(thumb-hover.png, slice 5 3 5 3)
ui.scrollthumb.pressed.bg = image(thumb-hover.png, slice 5 3 5 3)

ui.icon.notebook = image(icons/notebook.png)
ui.icon.section = image(icons/section.png)
ui.icon.page = image(icons/page.png)
ui.icon.add = image(icons/add.png)
ui.icon.chevron-left = image(icons/chevron-left.png)
ui.icon.chevron-right = image(icons/chevron-right.png)
ui.icon.dirty = image(icons/dirty.png)

# Ribbon command icons (32 px, drawn at 32 on large buttons and 16 on small ones). The registry command decides:
# "To Do" in the Tags gallery and the "To Do Tag" button both run toggle-task. email.png, meeting.png and
# outlook-tasks.png are drawn for Email Page, Meeting Details and Outlook Tasks, which run no command yet, so no key
# can reach them; they wait in icons/ for those commands.
ui.icon.cmd.paste = image(icons/paste.png)
ui.icon.cmd.cut = image(icons/cut.png)
ui.icon.cmd.copy = image(icons/copy.png)
ui.icon.cmd.toggle-task = image(icons/todo-tag.png)
ui.icon.cmd.find-in-files = image(icons/find-tags.png)
