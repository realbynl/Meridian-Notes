# A dark navy skin with a glowing cyan frame, a circuit-grid sidebar and corner brackets.
# Copy this folder to ~/.config/meridian/skins/midnight and run `skin-use midnight`. Art: ../make-themes.py
name = midnight
base = dark
accent = #3fd0ff

page.bg = image(page.png, slice 5 5 5 5)
page.inset = 1 1
page.fg = #cfe8f5
side.bg = image(circuit.png, tile)
side.fg = #bcd8e8
side.head.fg = #5ae6ff
side.active.bg = #14405a
bar.bg = #00000000
tab.bg = linear(90deg, #0b1220 0%, #12263f 100%)
tab.fg = #8ab4cc
tab.active.bg = #14405a
tab.active.fg = #7ff0ff
status.bg = linear(90deg, #0b3a52 0%, #1b1f55 100%)
status.fg = #e4f8ff
gutter.fg = #6f98b0
gutter.current.fg = #5ae6ff
cursorline.bg = #3fd0ff14
select.bg = #1d5f7e
select.fg = #ffffff

orn.1 = image(bracket-tl.png) anchor top-left offset 4 22 layer above
orn.2 = image(bracket-br.png) anchor bottom-right offset -4 -36 layer above
