# A notebook-like light skin: purple ribbon gradient, lavender sidebar, white page on a soft shadow.
# Copy this folder to ~/.config/meridian/skins/lavender and run `skin-use lavender`. Art: ../make-themes.py
name = lavender
base = light
accent = #7719aa

page.bg = image(page.png, slice 6 6 6 6)
page.inset = 1 0
page.fg = #222222
side.bg = image(lavender.png, tile)
side.fg = #3a2a4a
side.head.fg = #7719aa
side.active.bg = #ffffff
side.active.fg = #7719aa
bar.bg = #00000000
tab.bg = linear(90deg, #5b1280 0%, #8a2bbf 100%)
tab.fg = #e8d6f5
tab.active.bg = #ffffff
tab.active.fg = #5b1280
status.bg = linear(90deg, #5b1280 0%, #8a2bbf 100%)
status.fg = #ffffff
gutter.fg = #8a7aa0
gutter.current.fg = #7719aa
cursorline.bg = #7719aa12
select.bg = #d9c2ec
select.fg = #000000
link.fg = #5b1280
