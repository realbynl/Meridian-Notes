# A dark skin with a gradient status bar and a translucent sidebar. Copy to
# ~/.config/meridian/skins/glass-bar.conf and run `skin-use glass-bar`.
name = glass-bar
base = dark
accent = #7aa2f7
status.bg = linear(90deg, #1a2b4a 0%, #4a2b6a 100%)
status.fg = #ffffff
side.bg = #20242ccc
tab.bg = #ffffff10
