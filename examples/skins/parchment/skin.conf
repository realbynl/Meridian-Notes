# A warm light skin: wood frame with a gold inlay, parchment page, leather sidebar, gold corner flourishes.
# Copy this folder to ~/.config/meridian/skins/parchment and run `skin-use parchment`. Art: ../make-themes.py
name = parchment
base = light
accent = #a8741a

page.bg = image(page.png, slice 10 10 10 10)
page.inset = 4 2
page.fg = #3b2a1a
side.bg = image(leather.png, tile)
side.fg = #2e1f10
side.head.fg = #5a3a10
side.active.bg = #d9b66a
side.active.fg = #2e1f10
tab.bg = #6b4524
tab.fg = #f1e2c0
tab.active.bg = #e6d3a1
tab.active.fg = #3b2a1a
status.bg = #4d321a
status.fg = #f1e2c0
gutter.fg = #6e5630
gutter.current.fg = #7a4a10
cursorline.bg = #00000014
select.bg = #d9b66a
select.fg = #2e1f10
link.fg = #7a3b10

orn.1 = image(flourish-tl.png) anchor top-left offset 6 20 layer above
orn.2 = image(flourish-br.png) anchor bottom-right offset -6 -36 layer above
