[package]
name = "meridian-term"
version.workspace = true
edition.workspace = true

[dependencies]
unicode-width = "0.2"
# Native PNG / JPEG decoding for pictures (ImageMagick stays the fallback for other formats).
png = { version = "0.18", default-features = false }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
