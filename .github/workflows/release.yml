name: Test build release

# Push a tag like v0.0.9-test1 (or run the workflow by hand with a tag name) to build and publish a pre-release.
on:
  push:
    tags: ["v*-test*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.0.9-test1"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release -p meridian --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir=meridian-${{ matrix.name }}
          mkdir "$dir"
          exe=target/${{ matrix.target }}/release/meridian
          [ -f "$exe.exe" ] && exe="$exe.exe"
          cp "$exe" LICENSE README.md "$dir"/
          cp -r examples/skins "$dir"/skins
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$dir.zip" "$dir" >/dev/null; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.name }}
          path: meridian-${{ matrix.name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Meridian $TAG (test build)" --notes-file .github/release-notes.md
